<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f3b2a" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>生生之境</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="top">
      <div class="place">生生村</div>
      <div id="date">—</div>
      <div id="stats"></div>
      <div id="speed" role="group" aria-label="速度">
        <button data-speed="pause" aria-label="暫停">⏸</button>
        <button data-speed="normal" aria-label="正常">▶</button>
        <button data-speed="fast" aria-label="快速">⏩</button>
        <button data-speed="max" aria-label="極速">⏭</button>
      </div>
    </header>
    <main id="map" aria-label="地圖（A3 前為除錯畫面）">
      <pre id="debug"></pre>
    </main>
    <nav id="bottom">
      <button disabled>建設</button>
      <button disabled>提案</button>
      <button disabled>家族</button>
      <button disabled>世界</button>
      <button id="btn-save">存檔</button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
