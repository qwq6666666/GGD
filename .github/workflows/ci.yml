name: CI
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Headless 驗收（正常成長 10 年、存檔回放、速度一致性、100 年壓測）
        run: pnpm headless --scenario all --years 10
      - run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --no-save --prefix /tmp/pw playwright@1.63.0 && NODE_PATH=/tmp/pw/node_modules npx --prefix /tmp/pw playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/pw/node_modules pnpm e2e
