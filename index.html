<!doctype html>
<html lang="zh-Hant">

      <div id="toasts" aria-live="polite"></div>
    </main>
    <section id="card" hidden></section>
    <section id="sheet" hidden></section>
    <nav id="bottom">
      <button data-tab="build" aria-label="建設"><span class="ic">🏗</span><small>建設</small></button>
      <button data-tab="proposals" aria-label="提案"><span class="ic">📜</span><small>提案</small><span id="badge" hidden></span></button>
